name: Veille plateformes agréées
on:
  schedule:
    - cron: "17 6 * * 1"   # chaque lundi
  workflow_dispatch:
permissions:
  contents: write
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl pdfplumber pytest
      - run: pytest -q
      - run: python -m watch.fetch
      - name: Publier les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data CHANGELOG.md
          git diff --cached --quiet || git commit -m "Mise à jour de la liste des plateformes agréées ($(date +%F))"
          git push
